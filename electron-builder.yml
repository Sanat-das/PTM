appId: com.ptm.app
productName: PTM
copyright: PTM

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!node_modules/.cache/**'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: PTM-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

compression: normal
# Auto-update is opt-in: uncomment and point at YOUR release feed, rebuild,
# and the app's built-in update check starts working. GitHub Releases example:
# publish:
#   provider: github
#   owner: your-account
#   repo: your-repo
# Generic feed (any static file host) example:
# publish:
#   provider: generic
#   url: https://example.com/releases
asarUnpack:
  # ffmpeg is spawned as a process, so it cannot live inside the asar archive.
  - node_modules/ffmpeg-static/**
# Native deps (bufferutil, utf-8-validate, utp-native) all ship N-API prebuilds and are optional,
# so there is nothing to compile for the Electron ABI.
npmRebuild: false
